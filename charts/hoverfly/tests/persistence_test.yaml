# Persistence is the reason this chart exists: without it hoverfly keeps every
# simulation in memory and loses it on restart. These cover the parts that fail
# silently -- wrong storageClassName semantics, a shared scratch file, a sidecar
# in the wrong place in the Pod spec.
suite: persistence
release:
  name: rel
  namespace: testing
tests:
  - it: wires the volume, the preStop dump and a Recreate strategy
    templates:
      - templates/deployment.yaml
    set:
      persistence.enabled: true
    asserts:
      # ReadWriteOnce cannot be attached by two Pods, so a rolling update would
      # deadlock: the new Pod waits for a volume the old Pod still holds.
      - equal:
          path: spec.strategy.type
          value: Recreate
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: rel-hoverfly-data
      - exists:
          path: spec.template.spec.containers[0].lifecycle.preStop
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOVERFLY_STATE_FILE
            value: "/data/simulation.json"
      # Flags reach the wrapper through "$@" and are never spliced into the
      # script body, so no value can break out of its quoting.
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: /bin/sh
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: set -- "\$@" -import "\$\{HOVERFLY_STATE_FILE\}"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: exec /bin/hoverfly "\$@"

  - it: keeps a rolling update when the volume is ReadWriteMany
    templates:
      - templates/deployment.yaml
    set:
      persistence.enabled: true
      persistence.accessModes:
        - ReadWriteMany
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate

  - it: gives the preStop hook and the snapshot sidecar separate scratch files
    # Regression: both used to write ${STATE_FILE}.tmp, so a snapshot landing
    # during shutdown could truncate the file the preStop dump was renaming.
    templates:
      - templates/deployment.yaml
    set:
      persistence.enabled: true
      snapshot.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: snapshotter
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOVERFLY_STATE_TMP
            value: "/data/simulation.json.prestop.tmp"
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: HOVERFLY_STATE_TMP
            value: "/data/simulation.json.snapshot.tmp"

  - it: runs the snapshotter as a native sidecar on request
    # An init container with restartPolicy Always is stopped after the main
    # container, so the final preStop dump cannot be raced by a snapshot.
    templates:
      - templates/deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 29
    set:
      persistence.enabled: true
      snapshot.enabled: true
      snapshot.nativeSidecar: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: snapshotter
      - equal:
          path: spec.template.spec.initContainers[0].restartPolicy
          value: Always

  - it: omits storageClassName so the cluster default applies
    templates:
      - templates/pvc.yaml
    set:
      persistence.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.storageClassName
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi

  - it: disables dynamic provisioning when storageClass is a dash
    templates:
      - templates/pvc.yaml
    set:
      persistence.enabled: true
      persistence.storageClass: "-"
    asserts:
      - equal:
          path: spec.storageClassName
          value: ""

  - it: keeps the PVC on uninstall when retain is set
    templates:
      - templates/pvc.yaml
    set:
      persistence.enabled: true
      persistence.retain: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: mounts an existing claim instead of creating a PVC
    templates:
      - templates/pvc.yaml
      - templates/deployment.yaml
    set:
      persistence.enabled: true
      persistence.existingClaim: my-claim
    asserts:
      - hasDocuments:
          count: 0
        template: templates/pvc.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: my-claim
        template: templates/deployment.yaml

  # snapshot.image inherits the unset halves of image, but tag and digest name
  # the same thing and hoverfly.image prefers the digest. Inheriting them one
  # field at a time let a pinned image.digest outrank an explicit
  # snapshot.image.tag, so the sidecar quietly ran the main image instead.
  - it: does not let the main image digest shadow an explicit snapshot tag
    templates:
      - templates/deployment.yaml
    set:
      persistence.enabled: true
      snapshot.enabled: true
      image.digest: sha256:aaaabbbbccccddddeeeeffff00001111222233334444555566667777888899990
      snapshot.image.tag: v1.11.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/spectolabs/hoverfly@sha256:aaaabbbbccccddddeeeeffff00001111222233334444555566667777888899990
      - equal:
          path: spec.template.spec.containers[1].image
          value: docker.io/spectolabs/hoverfly:v1.11.0

  - it: does not let the main image tag shadow an explicit snapshot digest
    templates:
      - templates/deployment.yaml
    set:
      persistence.enabled: true
      snapshot.enabled: true
      image.tag: v1.12.13
      snapshot.image.digest: sha256:aaaabbbbccccddddeeeeffff00001111222233334444555566667777888899990
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/spectolabs/hoverfly:v1.12.13
      - equal:
          path: spec.template.spec.containers[1].image
          value: docker.io/spectolabs/hoverfly@sha256:aaaabbbbccccddddeeeeffff00001111222233334444555566667777888899990

  - it: still inherits the main tag when only the snapshot repository is overridden
    templates:
      - templates/deployment.yaml
    set:
      persistence.enabled: true
      snapshot.enabled: true
      image.tag: v1.12.13
      snapshot.image.repository: curlimages/curl
    asserts:
      - equal:
          path: spec.template.spec.containers[1].image
          value: docker.io/curlimages/curl:v1.12.13

  # An older kubelet ignores restartPolicy on an init container, so the snapshot
  # loop would run as a plain init container and never exit -- the Pod would hang
  # before the main container ever started.
  - it: rejects the native sidecar below Kubernetes 1.29
    templates:
      - templates/deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 28
    set:
      persistence.enabled: true
      snapshot.enabled: true
      snapshot.nativeSidecar: true
    asserts:
      - failedTemplate:
          errorPattern: snapshot.nativeSidecar=true needs Kubernetes 1.29 or newer

  - it: does not complain about the native sidecar when no sidecar is rendered
    templates:
      - templates/deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 23
    set:
      snapshot.nativeSidecar: true
    asserts:
      - hasDocuments:
          count: 1
