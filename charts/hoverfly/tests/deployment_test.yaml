suite: deployment
templates:
  - templates/deployment.yaml
release:
  name: rel
  namespace: testing
tests:
  - it: renders one unwrapped container with the standard labels
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: hoverfly
            app.kubernetes.io/instance: rel
      - notExists:
          path: spec.selector.matchLabels.app
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      # Neither persistence nor auth is on, so hoverfly is exec'd directly and
      # there is no shell wrapper to get quoting wrong in.
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /bin/hoverfly
      - contains:
          path: spec.template.spec.containers[0].args
          content: -ap=8888
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      # `enabled` is a chart-level switch and must not leak into the probe object.
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /api/health
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.enabled

  - it: takes the image tag from the chart appVersion
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^docker\.io/spectolabs/hoverfly:v[0-9]+\.[0-9]+\.[0-9]+$

  - it: prefers a digest over a tag and drops an empty registry
    set:
      image.registry: ""
      image.tag: v1.11.0
      image.digest: sha256:deadbeef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: spectolabs/hoverfly@sha256:deadbeef

  - it: honours nameOverride without swallowing the release name
    set:
      nameOverride: hf
    asserts:
      - equal:
          path: metadata.name
          value: rel-hf
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: hf

  - it: builds the flag list from typed values and drops the ones switched off
    set:
      hoverfly.webserver: false
      hoverfly.journalSize: 0
      hoverfly.extraArgs:
        - -metrics
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: -webserver
      - notContains:
          path: spec.template.spec.containers[0].args
          content: -journal-size=0
      - contains:
          path: spec.template.spec.containers[0].args
          content: -metrics

  - it: omits a probe that is disabled
    set:
      livenessProbe.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - exists:
          path: spec.template.spec.containers[0].readinessProbe

  # `securityContext: null` in a values file, or a key left with no value under
  # it, removes the section from the merged values entirely. The templates read
  # its fields directly, so an unparenthesised access turns that into a nil
  # pointer at render time rather than the "use the chart's defaults" the user
  # meant. Sections a user has a real reason to blank out must survive it.
  - it: renders with the hardening sections blanked out
    set:
      securityContext: null
      podSecurityContext: null
      resources: null
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.template.spec.containers[0].securityContext
      # No readOnlyRootFilesystem means no /tmp scratch mount to go with it,
      # and with nothing else mounted the Pod has no volumes at all.
      - notExists:
          path: spec.template.spec.volumes

  - it: renders with every probe blanked out
    set:
      startupProbe: null
      livenessProbe: null
      readinessProbe: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
