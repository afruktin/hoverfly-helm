apiVersion: v2
name: hoverfly
description: Hoverfly API simulator, with optional persistence of simulations across Pod restarts
type: application
version: 0.2.1
appVersion: "v1.12.16"
kubeVersion: ">=1.23.0-0"
home: https://hoverfly.io
icon: https://raw.githubusercontent.com/SpectoLabs/hoverfly/master/docs/_static/logo-large.png
sources:
  - https://github.com/afruktin/hoverfly-helm
  - https://github.com/SpectoLabs/hoverfly
keywords:
  - hoverfly
  - api
  - api-simulation
  - service-virtualization
  - mock
  - stub
  - testing
  - proxy
maintainers:
  - name: Artyom Fruktin
    email: 68115238+afruktin@users.noreply.github.com
    url: https://github.com/afruktin
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/afruktin/hoverfly-helm
    - name: Hoverfly documentation
      url: https://docs.hoverfly.io
    - name: support
      url: https://github.com/afruktin/hoverfly-helm/issues
  artifacthub.io/images: |
    - name: hoverfly
      image: docker.io/spectolabs/hoverfly:v1.12.16
  artifacthub.io/changes: |
    - kind: changed
      description: Hoverfly v1.12.16, up from v1.12.13 -- Go runtime and dependency updates, no flag changes
      links:
        - name: Hoverfly v1.12.16 release notes
          url: https://github.com/SpectoLabs/hoverfly/releases/tag/v1.12.16
    - kind: fixed
      description: The preStop hook and the snapshot sidecar no longer wait up to 15 minutes on a hung admin API; an export gives up after persistence.exportTimeoutSeconds of silence and keeps the previous snapshot
    - kind: added
      description: persistence.exportTimeoutSeconds, 30 by default; it counts idle time, so a large export that keeps streaming is never cut off
    - kind: changed
      description: The snapshot sidecar logs a failed snapshot instead of dropping it silently
    - kind: added
      description: Upgrading section in the chart README with the versioning policy and notes for every minor release
    - kind: added
      description: CI upgrades the previous release in place for every patch release
