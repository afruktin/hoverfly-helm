{{- if and .Values.simulations.inline (not .Values.simulations.existingConfigMap) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hoverfly.simulations.configMapName" . }}
  labels:
    {{- include "hoverfly.labels" . | nindent 4 }}
  {{- with (include "hoverfly.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{- range $name, $content := .Values.simulations.inline }}
  {{ $name | quote }}: |
    {{- include "hoverfly.tplvalues" (dict "value" $content "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
