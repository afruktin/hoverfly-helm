{{- if .Values.ingress.enabled -}}
{{- $fullName := include "hoverfly.fullname" . -}}
{{- $annotations := merge (deepCopy .Values.ingress.annotations) (deepCopy .Values.commonAnnotations) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "hoverfly.labels" . | nindent 4 }}
    {{- with .Values.ingress.labels }}
    {{- include "hoverfly.tplvalues" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- with $annotations }}
  annotations:
    {{- include "hoverfly.tplvalues" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- include "hoverfly.tplvalues" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ tpl .host $ | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: {{ default "proxy" .servicePortName }}
          {{- end }}
    {{- end }}
{{- end }}
