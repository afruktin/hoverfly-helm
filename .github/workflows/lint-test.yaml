name: Lint and test charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/lint-test.yaml'
      - '.github/scripts/**'
      - '.github/ct.yaml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/lint-test.yaml'
      - '.github/scripts/**'
      - '.github/ct.yaml'

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Published with kind v0.33.0. The oldest node image current kind supports, so
  # it is the closest thing to what users actually run -- and still well past the
  # 1.29 that `snapshot.nativeSidecar` needs. That floor is hard: the chart
  # rejects ci/snapshot-native-values.yaml below 1.29 on purpose, so any node
  # image added here has to stay at or above it.
  KIND_NODE_IMAGE: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d

jobs:
  lint-test:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.list-changed.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # chart-testing compares against the target branch to find changed charts.
          fetch-depth: 0

      # Helm 3, on purpose. Development happens on Helm 4, so Helm 3 is the side
      # nobody would otherwise exercise -- and it is the side most users are on.
      # Pinning it here is what stops a Helm-4-only template function from
      # reaching them as a broken release.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Set up chart-testing
        # v2.8.0 or newer: earlier releases pinned yamale 4.0.4, whose parser
        # still referenced ast.Num / ast.Str / ast.NameConstant. Those were
        # removed in Python 3.12, so ct died with an AttributeError as soon as
        # the runner's interpreter moved on. Since v2.8.0 the action installs
        # ct through uv, into a venv it owns, so the chart no longer depends on
        # whatever Python the runner happens to ship.
        uses: helm/chart-testing-action@v2.8.0

      - name: Find changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/ct.yaml)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing lint
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config .github/ct.yaml

      # Pinned to the last release Helm 3 can load. helm-unittest v1.1.0 renamed
      # `hooks:` to `platformHooks:` in its plugin.yaml to become installable
      # under Helm 4, and Helm 3 rejects the unknown field outright: the plugin
      # unpacks and then `plugin install` exits 1 with "installed but unusable".
      # Raise this only together with the Helm version above -- and read the note
      # there first, because that pin is deliberate.
      - name: Install helm-unittest
        if: steps.list-changed.outputs.changed == 'true'
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3

      - name: Run unit tests
        if: steps.list-changed.outputs.changed == 'true'
        run: helm unittest charts/hoverfly

      # kind cannot give us anything near the floor the chart advertises, so the
      # lower bound of `kubeVersion` is only ever checked by rendering.
      - name: Render at the declared kubeVersion bounds
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          for kube in 1.23.0 1.34.0; do
            for values in charts/hoverfly/ci/*-values.yaml; do
              # snapshot.nativeSidecar is rejected below 1.29 on purpose; the
              # step below asserts that rather than skipping past it.
              if [ "$kube" = 1.23.0 ] &&
                 [ "$values" = charts/hoverfly/ci/snapshot-native-values.yaml ]; then
                continue
              fi
              echo "--- kube-version=$kube $values"
              helm template rel charts/hoverfly \
                --kube-version "$kube" \
                --values "$values" >/dev/null
            done
          done

      # A native sidecar is an initContainer with `restartPolicy: Always`, which a
      # pre-1.29 kubelet ignores -- the snapshot loop would run as a plain init
      # container and never exit, hanging the Pod before hoverfly ever starts. The
      # guard that prevents that is only useful while it still fires, so pin both
      # sides of the boundary here.
      - name: Assert the native-sidecar guard holds at the 1.29 boundary
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          if helm template rel charts/hoverfly --kube-version 1.28.15 \
               --values charts/hoverfly/ci/snapshot-native-values.yaml >/dev/null 2>&1; then
            echo "snapshot.nativeSidecar rendered on 1.28: the guard is gone" >&2
            exit 1
          fi
          helm template rel charts/hoverfly --kube-version 1.29.0 \
            --values charts/hoverfly/ci/snapshot-native-values.yaml >/dev/null

      # Documentation drifts silently. Every values example in the chart README is
      # templated here, so a renamed value or a new validation breaks the build
      # rather than a reader's terminal.
      # The script is standard library only, so the runner's own python3 is
      # enough -- no setup-python step to pin, and nothing to break when the
      # image's interpreter moves.
      - name: Render the README examples
        if: steps.list-changed.outputs.changed == 'true'
        run: python3 .github/scripts/render-doc-examples.py

  # `helm template` cannot tell whether the hardened securityContext lets the
  # process start, whether the PVC binds, or whether a native sidecar ever
  # reaches Ready. This job is the first thing in the repository that runs the
  # chart on a cluster: `ct install` installs it once per ci/*-values.yaml file,
  # waits for readiness and runs the `helm test` hook.
  install:
    needs: lint-test
    if: needs.lint-test.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Set up chart-testing
        # v2.8.0 or newer: earlier releases pinned yamale 4.0.4, whose parser
        # still referenced ast.Num / ast.Str / ast.NameConstant. Those were
        # removed in Python 3.12, so ct died with an AttributeError as soon as
        # the runner's interpreter moved on. Since v2.8.0 the action installs
        # ct through uv, into a venv it owns, so the chart no longer depends on
        # whatever Python the runner happens to ship.
        uses: helm/chart-testing-action@v2.8.0

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: chart-testing

      - name: Run chart-testing install
        run: ct install --config .github/ct.yaml

  # `ct install` never restarts anything, so it cannot exercise the one feature
  # this chart exists for. This job posts a simulation, replaces the Pod and
  # checks the simulation is still being served.
  e2e-persistence:
    needs: lint-test
    if: needs.lint-test.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: e2e-persistence

      - name: Simulations survive a Pod replacement
        run: .github/scripts/e2e-persistence.sh
