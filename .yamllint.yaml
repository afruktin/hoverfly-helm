extends: default

rules:
  # Chart values carry long explanatory comments; wrapping them hurts readability.
  line-length: disable
  # Helm values files conventionally omit the document start marker.
  document-start: disable
  # `on:` in GitHub workflows is a legitimate key, not a boolean.
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
